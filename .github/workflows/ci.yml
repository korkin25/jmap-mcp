name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  cargo:
    # External forks must first pass GitHub's all_external_contributors approval.
    # The owner is the only write/admin collaborator. Approval does not change actor.
    if: >-
      github.repository == 'korkin25/jmap-mcp' &&
      ((github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork &&
        github.event.pull_request.head.repo.full_name != github.repository &&
        (github.run_attempt == 1 || github.triggering_actor == github.repository_owner)))
    runs-on: pure-vps-linux-x64-jmap-mcp
    timeout-minutes: 60
    steps:
      - name: Record runner and source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf 'runner=%s environment=%s source=%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$SOURCE_SHA"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked out source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - name: RustSec audit
        run: |
          [ -x ~/.cargo/bin/cargo-audit ] || cargo install --locked cargo-audit --version 0.22.1
          cargo audit --file Cargo.lock
      - name: OSV dependency audit
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        with:
          scan-args: |-
            --lockfile=./Cargo.lock
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check bans licenses sources
      - name: Clean job workspace
        if: always()
        run: |
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

  container:
    # External forks must first pass GitHub's all_external_contributors approval.
    # The owner is the only write/admin collaborator. Approval does not change actor.
    if: >-
      github.repository == 'korkin25/jmap-mcp' &&
      ((github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork &&
        github.event.pull_request.head.repo.full_name != github.repository &&
        (github.run_attempt == 1 || github.triggering_actor == github.repository_owner)))
    runs-on: pure-vps-linux-x64-jmap-mcp
    timeout-minutes: 60
    needs: cargo
    steps:
      - name: Record runner and source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf 'runner=%s environment=%s source=%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$SOURCE_SHA"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked out source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Resolve version
        id: version
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: jmap-mcp:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: jmap-mcp:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Clean job workspace
        if: always()
        run: |
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
