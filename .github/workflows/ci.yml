name: Build

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/korkin25/jmap-mcp

jobs:
  build:
    # External forks first require GitHub all_external_contributors approval.
    if: >-
      github.repository == 'korkin25/jmap-mcp' &&
      (github.ref != 'refs/heads/main' || github.event_name == 'pull_request') &&
      ((github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork &&
        github.event.pull_request.head.repo.full_name != github.repository &&
        (github.run_attempt == 1 || github.triggering_actor == github.repository_owner)))
    runs-on: pure-vps-linux-x64-jmap-mcp
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record runner and exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'runner=%s source=%s\n' "$RUNNER_NAME" "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Resolve package version
        id: version
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: jmap-mcp:build
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clean job workspace
        if: always()
        run: |
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

  publish:
    concurrency:
      group: release-main
      cancel-in-progress: false
    if: >-
      github.repository == 'korkin25/jmap-mcp' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: pure-vps-linux-x64-jmap-mcp
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record runner and exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'runner=%s source=%s\n' "$RUNNER_NAME" "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve package version
        id: version
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Source: %s\nImage: %s@%s\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean job workspace
        if: always()
        run: |
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
