name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/korkin25/jmap-mcp
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'korkin25/jmap-mcp' && github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: pure-vps-linux-x64-jmap-mcp
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record runner and exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'runner=%s environment=%s source=%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$GITHUB_SHA"
      - name: Install pinned envsubst for Cosign installer
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/gettext-base"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://archive.ubuntu.com/ubuntu/pool/main/g/gettext/gettext-base_0.21-14ubuntu2_amd64.deb \
            --output "$tool_dir/gettext-base.deb"
          echo "3e2806e94aba780cac11961ede06bffd14d4b840c4085be33d597ec93773fba5  $tool_dir/gettext-base.deb" | sha256sum --check --strict
          dpkg-deb --extract "$tool_dir/gettext-base.deb" "$tool_dir/root"
          "$tool_dir/root/usr/bin/envsubst" --version
          echo "$tool_dir/root/usr/bin" >> "$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - name: RustSec audit
        run: |
          [ -x ~/.cargo/bin/cargo-audit ] || cargo install --locked cargo-audit --version 0.22.1
          cargo audit --file Cargo.lock
      - name: OSV dependency audit
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        with:
          scan-args: |-
            --lockfile=./Cargo.lock
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check bans licenses sources

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve package version
        id: version
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      # Candidate is not an accepted release. Final tags only follow all scans.
      - name: Build candidate with provenance and SBOM
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan candidate by immutable digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          artifact-name: jmap-mcp-${{ github.sha }}.spdx.json
          output-file: jmap-mcp.spdx.json
          format: spdx-json
          upload-release-assets: false
      - name: Sign and promote scanned digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}:sha-${GITHUB_SHA}" --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          printf 'Source: `%s`\n\nImage: `%s@%s`\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean job workspace
        if: always()
        run: |
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
